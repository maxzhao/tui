name: Prepare Maxa fork CLI release
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed full maxzhao/tui commit SHA
        type: string
        required: true
      tag:
        description: Fork CLI tag (vX.Y.Z-maxa.N)
        type: string
        required: true
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'maxzhao/tui'
    runs-on: ubuntu-latest
    environment: cli-release
    permissions:
      contents: write
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate fork release identity
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          TAG: ${{ inputs.tag }}
        run: |
          printf '%s' "$SOURCE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-maxa\.[0-9]+$'
      - run: go vet ./... && go test ./...
      - name: Build Linux archives and checksums
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir release
          version="${TAG#v}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w -X github.com/ZenNotes/tui/internal/cli.Version=$version" -o release/zn ./cmd/zn
            tar -C release -czf "release/zn_${version}_linux_${arch}.tar.gz" zn
          done
          rm release/zn
          cd release && sha256sum zn_*.tar.gz > checksums.txt
      - name: Prepare draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: maxzhao/tui
          TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: gh release create "$TAG" release/* --target "$SOURCE_COMMIT" --title "$TAG" --draft --notes "Maxa fork CLI. Publish only after checksum, candidate install and rollback review."
